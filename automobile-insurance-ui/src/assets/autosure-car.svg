<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" fill="none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="body" x1="0" y1="100" x2="0" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="0.45" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="120" x2="0" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#BFDBFE" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="beam" x1="580" y1="205" x2="680" y2="205" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#93C5FD" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#93C5FD" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <!-- ambient glow + ground shadow -->
  <ellipse cx="340" cy="250" rx="330" ry="110" fill="url(#glow)"/>
  <ellipse cx="320" cy="302" rx="260" ry="14" fill="#020617" opacity="0.55"/>

  <!-- road lane marks -->
  <g stroke="#60A5FA" stroke-opacity="0.35" stroke-width="4" stroke-linecap="round">
    <path d="M20 322h70M130 322h70M240 322h70M350 322h70M460 322h70M570 322h70"/>
  </g>

  <!-- headlight beam -->
  <path d="M575 205L680 150V262Z" fill="url(#beam)"/>

  <!-- car body -->
  <path d="M60 262v-38c0-18 14-26 34-30l78-14c26-48 62-70 112-74l92-2c42 0 76 22 98 58l64 20c28 8 42 24 42 52v28Z" fill="url(#body)"/>
  <!-- roof highlight -->
  <path d="M196 170c22-36 54-54 94-56l90-2" stroke="#BFDBFE" stroke-opacity="0.7" stroke-width="3" stroke-linecap="round"/>
  <!-- windows -->
  <path d="M208 172c16-28 38-42 66-44h62v44Z" fill="url(#glass)"/>
  <path d="M350 128h38c26 4 44 20 58 44H350Z" fill="url(#glass)"/>
  <!-- door line + handle -->
  <path d="M344 128v132" stroke="#1E3A8A" stroke-opacity="0.7" stroke-width="2.5"/>
  <rect x="360" y="190" width="34" height="6" rx="3" fill="#DBEAFE" opacity="0.9"/>
  <rect x="300" y="190" width="30" height="6" rx="3" fill="#DBEAFE" opacity="0.9"/>
  <!-- lower body line -->
  <path d="M96 236h430" stroke="#93C5FD" stroke-opacity="0.45" stroke-width="2"/>

  <!-- lights -->
  <path d="M560 200c16 2 28 8 30 16-12 4-26 4-38 0Z" fill="#E0F2FE"/>
  <path d="M60 216c0-8 6-14 16-16v22c-10-1-16-2-16-6Z" fill="#F87171"/>

  <!-- wheel arches + wheels -->
  <circle cx="176" cy="262" r="50" fill="#0A1020"/>
  <circle cx="478" cy="262" r="50" fill="#0A1020"/>
  <g>
    <circle cx="176" cy="262" r="38" fill="#111C36" stroke="#3B82F6" stroke-width="4"/>
    <circle cx="176" cy="262" r="20" fill="#1E3A8A" stroke="#93C5FD" stroke-width="2"/>
    <circle cx="176" cy="262" r="5" fill="#DBEAFE"/>
    <circle cx="478" cy="262" r="38" fill="#111C36" stroke="#3B82F6" stroke-width="4"/>
    <circle cx="478" cy="262" r="20" fill="#1E3A8A" stroke="#93C5FD" stroke-width="2"/>
    <circle cx="478" cy="262" r="5" fill="#DBEAFE"/>
  </g>

  <!-- protection shield badge -->
  <g transform="translate(470 18)">
    <circle cx="38" cy="40" r="52" fill="#3B82F6" opacity="0.14"/>
    <path d="M38 0 76 14v26c0 24-16 40-38 50C16 80 0 64 0 40V14Z" fill="url(#shield)" stroke="#BFDBFE" stroke-opacity="0.6" stroke-width="2"/>
    <path d="M22 42l12 12 22-24" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
